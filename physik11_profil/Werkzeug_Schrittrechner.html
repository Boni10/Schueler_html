NgN/xm3og6a7J/8BzDfat2XAA==) format('woff2');font-display:swap}/* ===== Gemeinsame Bausteine: identisch in Stundenkarte, Beamer und Schüler-AB ===== */
:root{
  --ink:#1d2733; --ink-soft:#4a5665; --muted:#7a8594;
  --paper:#fbf1dc; --grid:#ecdcbc; --grid-strong:#dcc79f;
  --blue:#1c64d9; --blue-soft:#e7f0ff; --orange:#e0620d; --orange-soft:#fff0e4;
  --green:#23884a; --green-soft:#e5f5eb; --red:#c92a2a; --red-soft:#fdeaea;
  --violet:#7048c8; --violet-soft:#f1ebff; --gray-soft:#f2f4f7;
  --hand:"HandUA","Segoe Print","Bradley Hand","Segoe UI",sans-serif;
  --sans:"Segoe UI","Segoe UI Variable Text",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
.m{font-style:italic;white-space:nowrap}
.u{font-style:normal}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}

/* Hefteintrag im Heft-Look (Karo, Klebestreifen) */
.heft{position:relative;font-family:var(--hand);font-size:1.12em;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;background-position:-1px -1px;
  border:1px solid var(--grid-strong);border-radius:4px;padding:22px 24px 18px;color:var(--ink);
  box-shadow:0 2px 0 rgba(0,0,0,.03),0 8px 24px rgba(30,50,80,.07)}
.heft::before,.heft::after{content:"";position:absolute;top:-10px;width:86px;height:22px;
  background:rgba(255,214,120,.55);border:1px solid rgba(200,160,60,.25)}
.heft::before{left:18px;transform:rotate(-4deg)}
.heft::after{right:18px;transform:rotate(3deg)}
.heft h3{font-family:var(--hand);font-weight:400;color:var(--blue);font-size:1.55em;margin:0 0 .35em;line-height:1.1}
.heft p{margin:.35em 0;line-height:1.55}
.heft b{color:var(--blue);font-weight:400}
.heft .m{font-style:normal}
.heft h3{font-size:1.5em}
.heft ol{margin:.3em 0 .2em;padding-left:1.5em}
.heft ol li{margin:.22em 0;line-height:1.5}
.heft .bsp{font-style:italic;color:var(--ink-soft);margin-top:.5em}
.heft .bsp .m{font-style:italic}
.heft-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.heft-grid{grid-template-columns:1fr}.heft{padding:20px 14px 14px}}

/* Lücken: im Druck leer, am Bildschirm antippen zum Aufdecken */
.gap{display:inline-block;min-width:3.2em;padding:0 .25em;border-bottom:2px solid var(--ink-soft);
  color:transparent;cursor:pointer;text-align:center;transition:color .25s;border-radius:2px}
.gap:hover{background:rgba(28,100,217,.07)}
.gap.shown{color:var(--blue);font-weight:600}
.gap-svg{opacity:0;transition:opacity .35s}
.gap-svg.shown{opacity:1}
.netz .fbox{cursor:default}
.netz.lueckig .fbox{cursor:pointer}

/* Größennetz */
.netz{width:100%;height:auto;display:block;font-family:var(--sans)}
.netz .edge{stroke:#9aa7b6;stroke-width:2.2}
.netz .edge.used{stroke:var(--blue);stroke-width:4}
.netz .node circle{fill:#fff;stroke:var(--ink);stroke-width:2.2}
.netz .node text{font-size:23px;font-style:italic;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.netz .node.known circle{fill:var(--green-soft);stroke:var(--green);stroke-width:3.5}
.netz .node.derived circle{fill:var(--blue-soft);stroke:var(--blue);stroke-width:3.5}
.netz .node.target circle{fill:var(--orange-soft);stroke:var(--orange);stroke-width:3.5}
.netz .fbox rect.b{fill:#fff;stroke:var(--ink-soft);stroke-width:1.6}
.netz .fbox.used rect.b{stroke:var(--blue);stroke-width:3;fill:#f6f9ff}
.netz .fbox text{font-size:17px;fill:var(--ink);dominant-baseline:central}
.netz .fbox text.it{font-style:italic}
.netz .badge circle{fill:var(--ink-soft)}
.netz .fbox.used .badge circle{fill:var(--blue)}
.netz .badge text{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-style:normal}
.netz .step text{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.netz .step circle{fill:var(--orange)}
.netz .cap{font-family:var(--hand);font-size:17px;fill:var(--ink-soft)}
.netz.interaktiv .node{cursor:pointer}

/* Zeichnungen */
.fig{width:100%;height:auto;display:block}
.fig .hand{font-family:var(--hand)}

@media print{
  .gap,.gap.shown{color:transparent!important;background:none}
  .gap-svg,.gap-svg.shown{opacity:0!important}
  .heft{box-shadow:none;break-inside:avoid}
  .heft::before,.heft::after{display:none}
}
.heft table.groessen{border-collapse:collapse;margin:.5em 0;width:100%;max-width:560px}
.heft table.groessen th{text-align:left;border-bottom:1.5px solid var(--ink);padding:2px 8px 2px 0}
.heft table.groessen td{padding:2px 8px 2px 0;border-bottom:1px solid var(--grid-strong)}
.heft .skizze svg{max-width:230px;margin:0 auto}
.beispiel .bsp-titel,.vorgehen .vg-titel{font-weight:700;margin-bottom:.3em}
.beispiel p{margin:.2em 0 .5em}
table.rechnung{border-collapse:collapse;width:100%}
table.rechnung td{padding:5px 8px 5px 0;vertical-align:middle}

<h1>Schrittrechner</h1><p class="unter">Die Methode der kleinen Schritte ohne Tabellenkalkulation. Kraftgesetz als Term in t, y und v eingeben (Parameter m, g, D, k, r), Zeitschritt wählen, rechnen. Der erste Schritt nutzt den Halbschritt wie im Praktikumsleitfaden.</p><div id="schrittrechner"></div></div>
<script>/* Mathe-Bausteine für digitale ABs, Werkzeuge und Beamer (läuft im Browser und in Node):
   MB = Brüche (einlesen, kürzen, anzeigen), MT = Terme (einlesen, auswerten, vergleichen, Rechenbaum). */
var MB = (function () {
  function ggT(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
  function kgV(a, b) { return Math.abs(a * b) / ggT(a, b); }
  function norm(z, n) { if (n < 0) { z = -z; n = -n; } return [z, n]; }
